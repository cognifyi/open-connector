{{- /*
  Chart-managed Secret. OC-4 made a missing encryption key fail fast at
  runtime, so a chart-managed install without an explicit
  `secret.encryptionKey` must not render a key-less Secret: the first
  install generates a stable random key, and upgrades reuse the previously
  rendered value (via `lookup`) instead of rotating it. Deployments that
  reference an externally-managed Secret (`secret.existingSecret`, e.g. the
  k3s track's `open-connector-secrets`) skip this template entirely and keep
  owning the key lifecycle themselves.
*/ -}}
{{- if not .Values.secret.existingSecret -}}
{{- $secretName := include "open-connector.fullname" . -}}
{{- $prevData := dict -}}
{{- with lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $prevData = default (dict) .data -}}
{{- end -}}
{{- $generatedKey := "" -}}
{{- with get $prevData "encryptionKey" -}}
{{- $generatedKey = . | b64dec -}}
{{- else -}}
{{- $generatedKey = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "open-connector.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range $key := .Values.secret.secretKeys }}
  {{- $value := index $.Values.secret $key -}}
  {{- if and (eq $key "encryptionKey") (not $value) -}}
  {{- $value = $generatedKey -}}
  {{- end -}}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
